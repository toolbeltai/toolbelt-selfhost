# smart-parser's fast-agent config, pointed at the hosted endpoint (the image's
# own copy names Nebius). Mounted over /app/fastagent.config.yaml; ${...} are
# filled by fast-agent from the smart-parser container env.
default_model: openai/${CHAT_MODEL:chat}

openai:
  api_key: ${NEBIUS_API_KEY}
  base_url: ${INFERENCE_BASE_URL:https://inference.toolbelt.ai/v1}

skills:
  directories:
    - skills

agents:
  file_parser:
    shell: true
